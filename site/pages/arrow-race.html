<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ar_title">Arrow Race</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* ---- layout: buddy panel on the LEFT, race on the RIGHT, in both languages (the row is forced LTR;
       the cards inside get the page direction back). On narrow screens they stack, buddy on top. ---- */
    .race { direction: ltr; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
    html[dir="rtl"] .race > * { direction: rtl; }
    .play { min-width: 0; }
    .buddy { padding: 12px; }
    .buddy-title { text-align: center; font-weight: 800; font-size: 15px; color: var(--muted); margin-bottom: 8px; min-height: 42px; }
    .stage {
      position: relative; height: 330px; border-radius: 14px; overflow: hidden; direction: ltr; contain: layout paint;
      background: linear-gradient(#dff1ff, #f7fbff 68%, #cfe9c8 68%, #b9dcb0);
    }
    .stage.kitchen { background: linear-gradient(#fff3e0, #ffe9d3 72%, #e9c79a 72%, #d9a35b); }
    .stage.paper { background: #fffdf7; }
    @media (max-width: 760px) {
      .race { grid-template-columns: 1fr; }
      .stage { height: 220px; }
      .buddy-title { min-height: 0; }
    }

    /* ---- setup ---- */
    .pick-label { font-weight: 800; font-size: 20px; }
    .durs { direction: ltr; }
    .durs .chip { font-size: 20px; padding: 10px 18px; min-height: 48px; }
    .best { color: var(--muted); font-weight: 700; }
    #start { font-size: 30px; padding: 10px 34px; }

    /* ---- HUD: countdown ring + score ---- */
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .ring { position: relative; width: 84px; height: 84px; flex: none; }
    .ring svg { width: 100%; height: 100%; display: block; }
    .ring .trk { fill: none; stroke: var(--line); stroke-width: 9; }
    .ring .arc { fill: none; stroke: var(--tens); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 276.5; transform: rotate(-90deg); transform-origin: 50% 50%; }
    .ring.hurry .arc { stroke: var(--bad); }
    .ring .secs { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; }
    .ring.hurry .secs { color: var(--bad); animation: pop .5s ease infinite; }
    .score { font-weight: 900; font-size: 24px; }

    /* ---- the number cross: ALWAYS left-to-right (left arrow = left number, also in Hebrew) ---- */
    .cross {
      direction: ltr; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px;
      max-width: 420px; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .opt {
      font: inherit; font-weight: 900; color: var(--ink); border: 3px solid var(--line); border-radius: 18px; background: #fff;
      min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .08); transition: transform .2s var(--spring), border-color .2s, background .2s, box-shadow .2s;
    }
    .opt:active { transform: scale(.94); box-shadow: 0 1px 0 rgba(0, 0, 0, .08); }
    .opt .ar { font-size: 18px; color: var(--muted); line-height: 1; }
    .opt .n { font-size: clamp(30px, 8vw, 44px); line-height: 1.1; }
    .opt[data-dir="up"] { grid-area: 1 / 2; } .opt[data-dir="left"] { grid-area: 2 / 1; } .opt[data-dir="right"] { grid-area: 2 / 3; } .opt[data-dir="down"] { grid-area: 3 / 2; }
    .mid {
      grid-area: 2 / 2; display: flex; align-items: center; justify-content: center; min-height: 96px;
      background: var(--tens-soft); border: 4px solid var(--tens); border-radius: 22px;
      font-size: clamp(40px, 11vw, 64px); font-weight: 900; color: var(--tens); line-height: 1;
    }
    .mid.pop { animation: popSpring .6s var(--settle); }
    .opt.ok { background: var(--good); border-color: var(--good); color: #fff; animation: bounceIn .55s var(--settle); }
    .opt.bad { background: var(--bad); border-color: var(--bad); color: #fff; animation: shake .3s ease 2; }
    .opt.ok .ar, .opt.bad .ar { color: rgba(255, 255, 255, .85); }
    .opt.dim { opacity: .55; }
    .round-in .opt { animation: optIn .45s var(--spring) both; }
    @keyframes optIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ---- end screen ---- */
    .final { font-size: 72px; font-weight: 900; color: var(--tens); line-height: 1; }
    .end-title { font-size: 28px; font-weight: 900; }
    .newbest { font-size: 24px; font-weight: 900; color: var(--good); animation: bounceIn .6s var(--settle); }

    /* ---- buddies (shared) ----
       Per-answer feedback is snappy (≤ .7 s); finales are leisurely (≈ 4–5 s) so the characters can be watched. */
    .badge { position: absolute; font-size: 26px; line-height: 1; pointer-events: none; will-change: transform, opacity; animation: bBadge 1.6s var(--settle) forwards; }
    @keyframes bBadge { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 20% { transform: scale(1.2) rotate(6deg); opacity: 1; } 35% { transform: scale(1); } 80% { transform: translateY(-6px); opacity: 1; } 100% { transform: translateY(-16px) scale(.8); opacity: 0; } }
    .cloud { position: absolute; font-size: 28px; opacity: .85; animation: drift 9s ease-in-out infinite alternate; }
    .cloud.c1 { left: 8%; top: 8%; } .cloud.c2 { right: 10%; top: 22%; animation-duration: 12s; animation-delay: -4s; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(16px); } }
    .ground { position: absolute; inset: auto 0 0 0; height: 18%; background: linear-gradient(#8fcf86, #6fb866); }

    /* 1. painting 🎨: a line drawing gets colored region by region; when complete the picture comes alive */
    .paint { position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center; }
    .paint svg { width: 100%; height: 100%; overflow: visible; }
    .rg { fill-opacity: 0; transition: fill-opacity .7s ease; stroke: #2b2a33; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
    .rg.on { fill-opacity: 1; animation: rgPop .6s var(--spring); }
    @keyframes rgPop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .ln { fill: none; stroke: #2b2a33; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #2b2a33; stroke: none; }
    .smile { opacity: 0; transition: opacity .6s; }
    .alive .smile { opacity: 1; }
    .alive .a-spin { animation: aSpin 3.6s ease-in-out; }
    .alive .a-sway { animation: aSway 1.4s ease-in-out 3; transform-origin: 50% 100%; }
    .alive .a-wag { animation: aWag 1.1s ease-in-out 4; transform-origin: 100% 100%; }
    .alive .a-rock { animation: aSway 2.2s ease-in-out 2; transform-origin: 50% 100%; }
    .alive .a-swim { animation: aSwim 4s ease-in-out; }
    .alive .a-bob { animation: aBob 1.6s ease-in-out 3; }
    @keyframes aSpin { to { transform: rotate(360deg); } }
    @keyframes aSway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
    @keyframes aWag { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
    @keyframes aSwim { 0% { transform: translateX(0) scaleX(1); } 48% { transform: translateX(-70px) scaleX(1); } 52% { transform: translateX(-70px) scaleX(-1); } 100% { transform: translateX(0) scaleX(-1); } }
    @keyframes aBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* 2. rainbow 🌈 + visiting unicorn 🦄: seven bands draw in; when complete the unicorn flies in and rests under the arch */
    .rbow { position: absolute; left: 6%; right: 6%; bottom: 14%; height: 70%; }
    .rbow svg { width: 100%; height: 100%; overflow: visible; }
    .ghost { fill: none; stroke: #2b2a33; stroke-width: 10; stroke-linecap: round; opacity: .07; }
    .band { fill: none; stroke-width: 10.5; stroke-linecap: round; opacity: 0; transition: stroke-dashoffset .9s var(--settle), opacity .4s; }
    .band.on { opacity: 1; }
    .flyer { position: absolute; left: 0; top: 0; font-size: 56px; line-height: 1; opacity: 0; will-change: transform, opacity; }
    .flyer.hover { animation: hover 1.6s ease-in-out infinite; }
    @keyframes hover { 0%, 100% { transform: translate(var(--x), var(--y)); } 50% { transform: translate(var(--x), calc(var(--y) - 9px)); } }

    /* 3. smoothie 🥤: fruit plops into the glass; when full the lid goes on, it shakes, blends and gets a straw */
    .cup { position: absolute; left: 50%; bottom: 30px; width: 110px; height: 160px; margin-left: -55px; }
    .cup .body { position: absolute; inset: 0; transform-origin: 50% 100%; }
    .cup.shake .body { animation: cupShake 1.7s ease-in-out; }
    @keyframes cupShake { 0%, 100% { transform: rotate(0); } 12% { transform: rotate(-10deg) translateX(-4px); } 25% { transform: rotate(10deg) translateX(4px); } 37% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } 62% { transform: rotate(-9deg) translateX(-3px); } 75% { transform: rotate(9deg) translateX(3px); } 87% { transform: rotate(-4deg); } }
    .glass { position: absolute; inset: 0; border: 4px solid #7d8198; border-top-width: 5px; border-radius: 10px 10px 34px 34px; background: rgba(255, 255, 255, .55); overflow: hidden; }
    .shine { position: absolute; left: 8px; top: 12px; width: 9px; height: 55%; border-radius: 6px; background: rgba(255, 255, 255, .7); }
    .juice { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(#ffb3c1, #ff7eb6 45%, #f08a24); transform: scaleY(0); transform-origin: 50% 100%; transition: transform 1.3s var(--settle); }
    .cup.full .juice { transform: scaleY(.88); }
    .fruits { position: absolute; inset: 0; }
    .fruit { position: absolute; font-size: 34px; line-height: 1; transform: rotate(var(--rot)); animation: fruitDrop .7s var(--settle) both; will-change: transform, opacity; }
    @keyframes fruitDrop { 0% { transform: translateY(-180px) rotate(0); opacity: 0; } 10% { opacity: 1; } 60% { transform: translateY(0) rotate(var(--rot)); } 75% { transform: translateY(-14px) scale(1.08, .92) rotate(var(--rot)); } 100% { transform: translateY(0) rotate(var(--rot)); } }
    .fruit.out { animation: fruitOut .55s ease-in forwards; }
    @keyframes fruitOut { 0% { transform: translateY(0) rotate(var(--rot)); opacity: 1; } 40% { transform: translateY(-50px) scale(1.1); opacity: 1; } 100% { transform: translateY(-130px) scale(.6); opacity: 0; } }
    .cup.blend .fruit { animation: swirl 1.5s ease-in forwards; }
    @keyframes swirl { 0% { transform: rotate(var(--rot)); opacity: 1; } 100% { transform: translate(var(--sx), 50px) rotate(720deg) scale(.15); opacity: 0; } }
    .lid { position: absolute; left: -6px; right: -6px; top: -14px; height: 18px; border-radius: 9px; background: #e04848; box-shadow: 0 3px 0 #b33; transform: translateY(-90px); opacity: 0; transition: transform .6s var(--spring), opacity .3s; }
    .cup.lidon .lid { transform: none; opacity: 1; }
    .straw { position: absolute; width: 12px; height: 130px; left: 72px; top: -64px; border-radius: 6px; background: repeating-linear-gradient(135deg, #fff 0 8px, #e04848 8px 16px); box-shadow: 0 0 0 1.5px #7d8198; transform: translateY(-140px) rotate(14deg); opacity: 0; transition: transform .7s var(--spring), opacity .3s; }
    .cup.straw-in .straw { transform: rotate(14deg); opacity: 1; }
    .smiley { position: absolute; left: 50%; top: 42%; font-size: 40px; line-height: 1; transform: translate(-50%, -50%) scale(0); opacity: 0; transition: transform .6s var(--spring), opacity .3s; }
    .cup.happy .smiley { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    /* 4. monkey 🐒: climbs the trunk to the banana (the `.face` carries the hop / oops / cheer keyframes so they never fight the climb transition) */
    .mover { position: absolute; font-size: 54px; line-height: 1; transition: transform .5s var(--spring); will-change: transform; }
    .face { display: inline-block; transform-origin: 50% 90%; animation: bIdle 2.6s ease-in-out infinite; }
    .face.hop { animation: bHop .5s var(--settle); }
    .face.oops { animation: bOops .7s ease; }
    .face.cheer { animation: bCheer 1.1s var(--settle) 2; }
    @keyframes bIdle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-3deg); } }
    @keyframes bHop { 0% { transform: scale(1); } 30% { transform: translateY(-14px) scale(.92, 1.1); } 60% { transform: translateY(0) scale(1.1, .9); } 100% { transform: none; } }
    @keyframes bOops { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-16deg) scale(.95); } 50% { transform: rotate(14deg); } 75% { transform: rotate(-8deg); } }
    @keyframes bCheer { 0% { transform: scale(1); } 20% { transform: translateY(-22px) rotate(-14deg) scale(1.15); } 45% { transform: translateY(0) scale(1.15, .85); } 65% { transform: translateY(-12px) rotate(12deg); } 100% { transform: none; } }
    .item { position: absolute; line-height: 1; transform-origin: 50% 0; transition: transform .6s var(--spring), opacity .5s; will-change: transform, opacity; }
    .item.eat { transform: scale(0) rotate(40deg); opacity: 0; }
    .item.pop { animation: itemPop .7s var(--spring); }
    @keyframes itemPop { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
    .trunk { position: absolute; left: 50%; top: 58px; bottom: 0; width: 24px; margin-left: -12px; border-radius: 12px 12px 0 0; background: repeating-linear-gradient(180deg, #a8722f 0 18px, #8a5a22 18px 22px); }
    .canopy { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); line-height: 0; }
    .banana { left: 50%; top: 60px; margin-left: 14px; font-size: 34px; }
    .mon { left: 50%; bottom: 14px; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      .face, .face.hop, .face.oops, .face.cheer, .cloud, .item.pop, .mid.pop, .opt.ok, .opt.bad, .round-in .opt, .ring.hurry .secs, .newbest,
      .rg.on, .alive .a-spin, .alive .a-sway, .alive .a-wag, .alive .a-rock, .alive .a-swim, .alive .a-bob, .flyer.hover, .cup.shake .body, .fruit, .cup.blend .fruit { animation: none; }
      .fruit.out { animation: none; opacity: 0; transition: opacity .3s; }
      .flyer.hover { transform: translate(var(--x), var(--y)); }
      .badge { animation: bBadgeQuiet 1.3s ease forwards; }
      @keyframes bBadgeQuiet { 0% { opacity: 0; } 20%, 80% { opacity: 1; } 100% { opacity: 0; } }
      .mover, .item, .band, .rg, .juice, .lid, .straw, .smiley, .opt { transition-duration: .25s; transition-timing-function: ease-out; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" data-i18n="back"></a>
    <h1 data-i18n="ar_title"></h1>
    <div class="toggles" data-toggles></div>
  </header>

  <main class="page stack">
    <p class="intro" data-i18n="ar_intro"></p>
    <div class="race">
      <aside class="card buddy">
        <div class="buddy-title" id="buddyTitle"></div>
        <div class="stage" id="stage" aria-hidden="true"></div>
      </aside>

      <div class="card play">
        <!-- 1. setup -->
        <div id="setup" class="stack center">
          <div class="pick-label" data-i18n="ar_pick"></div>
          <div class="chips durs" id="durs"></div>
          <div><button class="btn plus" id="start" data-i18n="ar_start"></button></div>
          <p class="kbd-hint" data-i18n="ar_how"></p>
          <div class="best" id="bestline"></div>
        </div>
        <!-- 2. the race -->
        <div id="game" class="stack" hidden>
          <div class="hud">
            <div class="ring" id="ring">
              <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" id="arc" cx="50" cy="50" r="44"/></svg>
              <div class="secs" id="secs"></div>
            </div>
            <div class="score" id="score"></div>
          </div>
          <div class="cross" id="cross">
            <button class="opt" data-dir="up"><span class="ar">↑</span><span class="n"></span></button>
            <button class="opt" data-dir="left"><span class="ar">←</span><span class="n"></span></button>
            <div class="mid" id="mid"></div>
            <button class="opt" data-dir="right"><span class="ar">→</span><span class="n"></span></button>
            <button class="opt" data-dir="down"><span class="ar">↓</span><span class="n"></span></button>
          </div>
          <div class="caption" id="caption"></div>
          <p class="kbd-hint" data-i18n="ar_how"></p>
        </div>
        <!-- 3. results -->
        <div id="end" class="stack center" hidden>
          <div class="end-title" data-i18n="ar_time"></div>
          <div class="final" id="final"></div>
          <div id="result"></div>
          <div class="best" id="misses"></div>
          <div id="endbest"></div>
          <div class="controls">
            <button class="btn plus" id="again" data-i18n="ar_again"></button>
            <button class="btn ghost small" id="change" data-i18n="ar_change"></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/strings.js"></script>
  <script src="../assets/common.js"></script>
  <script>
    const el = id => document.getElementById(id);
    const { t, eq, wait, rand, shuffle } = PV;
    const DURS = [30, 60, 90], DIRS = ['up', 'left', 'right', 'down'];
    const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    const RING = 276.5;   // 2π · 44
    const store = {
      get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
    };
    const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };
    const mk = (cls, html = '', tag = 'div') => { const d = document.createElement(tag); d.className = cls; d.innerHTML = html; return d; };
    const kick = (node, cls) => { if (!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };   // restart a keyframe

    /* ================= rounds =================
       Center numbers lean hard on the edges: 55% x9, 17% x8, the rest ordinary (ones 0–7). Every number shown stays under 100 (the last center is 98 → 99).
       Distractors are the classic crossing-a-ten errors: after 29 → 40 (skipped
       a ten), 20 (forgot to change the tens), 39 (changed the tens, kept the ones), 28 (went backwards). */
    function pickCenter() {
      const r = Math.random();
      if (r < .55) return rand(0, 8) * 10 + 9;
      if (r < .72) return rand(0, 9) * 10 + 8;
      let n; do { n = rand(0, 97); } while (n % 10 >= 8);
      return n;
    }
    function distractors(n) {
      const next = n + 1, tn = Math.floor(n / 10), o = n % 10;
      const clean = arr => shuffle([...new Set(arr)].filter(v => Number.isInteger(v) && v !== next && v >= 0 && v <= 99 && v !== n));
      let picks;
      if (o === 9) {
        const classics = clean([(tn + 2) * 10, tn * 10]);                                        // 40, 20
        const extras = clean([n + 10, n - 1, n + 2]);                                              // 39, 28, 31
        picks = classics.slice(0, 2).concat(extras);
      } else if (o === 8) {
        picks = clean([(tn + 1) * 10, n - 1, n + 10, n + 11, n + 3]);                              // 30, 27, 38, 39, 31
      } else {
        picks = clean([n - 1, n + 10, n + 2, n + 11, n - 10, (tn + 1) * 10]);
      }
      picks = [...new Set(picks)];
      for (let d = 2; picks.length < 3; d++) clean([n - d, n + d + 1]).forEach(v => picks.length < 3 && !picks.includes(v) && picks.push(v));
      return picks.slice(0, 3);
    }
    let lastDirs = [];
    const o9 = n => n % 10 === 9;
    function makeRound() {
      const n = pickCenter(), next = n + 1, wrong = distractors(n);
      let dirs;
      do { dirs = shuffle([...DIRS]); } while (lastDirs.length >= 2 && lastDirs.every(d => d === dirs[0]));   // never 3 in a row
      lastDirs = [...lastDirs.slice(-1), dirs[0]];
      const opts = {}; opts[dirs[0]] = next; wrong.forEach((v, i) => opts[dirs[i + 1]] = v);
      return { n, next, cross: o9(n), dir: dirs[0], opts };
    }

    /* ================= buddies =================
       Each buddy: steps (points to a finale), build(stage), render(level, stage), party(ctx) (the finale, ≈ 4–5 s),
       optional oops(ctx). The controller keeps `level`; render() is idempotent so it can re-sync after a finale. */

    /* --- 1. painting: three original pictures, 7 regions each, painted in DOM order --- */
    const SUN = (cx, cy) => `<g class="rg a-spin" fill="#f5c400"><circle cx="${cx}" cy="${cy}" r="17"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M${cx + 23 * Math.cos(a * Math.PI / 180)} ${cy + 23 * Math.sin(a * Math.PI / 180)} L${cx + 31 * Math.cos(a * Math.PI / 180)} ${cy + 31 * Math.sin(a * Math.PI / 180)}"/>`).join('')}</g>
      <g class="smile"><circle class="dot" cx="${cx - 6}" cy="${cy - 4}" r="1.8"/><circle class="dot" cx="${cx + 6}" cy="${cy - 4}" r="1.8"/><path class="ln" d="M${cx - 7} ${cy + 4} Q${cx} ${cy + 10} ${cx + 7} ${cy + 4}"/></g>`;
    const FLOWER = (x, y, col) => `<g class="rg a-sway" fill="${col}"><path class="ln" d="M${x} ${y} V${y - 18}"/>${[0, 72, 144, 216, 288].map(a => `<circle cx="${x + 6 * Math.cos((a - 90) * Math.PI / 180)}" cy="${y - 24 + 6 * Math.sin((a - 90) * Math.PI / 180)}" r="5"/>`).join('')}<circle cx="${x}" cy="${y - 24}" r="3.5" fill="#f5c400"/></g>`;
    const PICS = [
      // a house with a sun, a tree and a flower
      `<svg viewBox="0 0 200 200">${SUN(160, 42)}
        <path class="rg" fill="#e04848" d="M38 102 L100 48 L162 102 Z"/>
        <rect class="rg" fill="#ffd9a8" x="52" y="102" width="96" height="68"/>
        <rect class="rg" fill="#a8722f" x="88" y="126" width="24" height="44" rx="3"/>
        <rect class="ln" x="60" y="112" width="18" height="18"/><path class="ln" d="M69 112v18M60 121h18"/><rect class="ln" x="122" y="112" width="18" height="18"/><path class="ln" d="M131 112v18M122 121h18"/>
        <rect class="rg" fill="#8fcf86" x="2" y="170" width="196" height="28"/>
        <g class="rg a-sway" fill="#2a9d5b"><rect x="18" y="136" width="10" height="34" fill="#8a5a22"/><circle cx="23" cy="122" r="22"/></g>
        ${FLOWER(178, 170, '#ff7eb6')}</svg>`,
      // a cat in a garden
      `<svg viewBox="0 0 200 200">${SUN(40, 40)}
        <rect class="rg" fill="#8fcf86" x="2" y="150" width="196" height="48"/>
        <g class="rg" fill="#2a9d5b"><circle cx="22" cy="138" r="20"/><circle cx="42" cy="146" r="14"/></g>
        <path class="rg a-wag" fill="#f08a24" d="M92 156 Q60 156 60 126 Q61 112 72 114 Q68 134 94 142 Z"/>
        <g class="rg a-bob" fill="#f08a24"><ellipse cx="124" cy="152" rx="34" ry="22"/><circle cx="152" cy="118" r="20"/><path d="M138 106 L140 88 L152 100 Z"/><path d="M166 106 L164 88 L152 100 Z"/>
          <circle class="dot" cx="145" cy="116" r="2.2"/><circle class="dot" cx="159" cy="116" r="2.2"/><path d="M149 123 L155 123 L152 127 Z" fill="#ff7eb6"/><path class="ln" d="M152 127 Q148 132 144 129 M152 127 Q156 132 160 129 M128 120 L140 122 M128 128 L140 126 M176 120 L164 122 M176 128 L164 126"/></g>
        ${FLOWER(182, 160, '#ff7eb6')}${FLOWER(100, 192, '#8e44ad')}</svg>`,
      // a sailboat with a fish
      `<svg viewBox="0 0 200 200">${SUN(40, 40)}
        <rect class="rg" fill="#9ec5ff" x="2" y="132" width="196" height="66"/><path class="ln" d="M10 160 q10 -6 20 0 t20 0 t20 0 M120 175 q10 -6 20 0 t20 0 t20 0"/>
        <g class="a-rock" style="transform-box: fill-box; transform-origin: 50% 100%">
          <path class="rg" fill="#a8722f" d="M56 132 L144 132 L130 152 L70 152 Z"/>
          <path class="rg" fill="#e04848" d="M98 60 L98 126 L58 126 Z"/>
          <path class="rg" fill="#f5c400" d="M106 72 L106 126 L138 126 Z"/>
          <path class="ln" d="M102 48 V132"/>
          <path class="rg" fill="#2a9d5b" d="M102 48 L122 55 L102 62 Z"/></g>
        <g class="rg a-swim" fill="#f08a24"><ellipse cx="156" cy="176" rx="14" ry="8"/><path d="M170 176 L182 168 L182 184 Z"/><circle class="dot" cx="150" cy="174" r="1.6"/></g></svg>`,
    ];

    const Buddies = {
      painting: {
        steps: 7, title: 'ar_buddy_paint',
        build(st) {
          st.classList.add('paper');
          this.box = mk('paint', PICS[rand(0, PICS.length - 1)]); st.append(this.box);
          this.svg = this.box.querySelector('svg'); this.regions = [...this.svg.querySelectorAll('.rg')]; this.steps = this.regions.length;
        },
        render(level) { this.regions.forEach((r, i) => r.classList.toggle('on', i < level)); },
        oops(ctx) { ctx.badgeAt(80, 8, '💧'); },
        async party(ctx) {
          await wait(500);
          this.svg.classList.add('alive'); PV.sound.bells(); PV.sparkle(this.box, 10);        // the picture comes alive
          await wait(1800);
          ctx.badgeAt(50, 4, '🎨'); PV.sound.twinkle(); PV.sparkle(this.box, 8);
          await wait(1900);
          this.svg.classList.remove('alive');
          for (let i = this.regions.length - 1; i >= 0; i--) { this.regions[i].classList.remove('on'); await wait(110); }   // back to a line drawing
          await wait(400);
        },
      },

      /* --- 2. rainbow + visiting unicorn --- */
      rainbow: {
        steps: 7, title: 'ar_buddy_rainbow',
        build(st) {
          const cols = ['#e04848', '#f08a24', '#f5c400', '#2a9d5b', '#2f6fdb', '#5b3fd6', '#8e44ad'];
          const arc = r => `M${110 - r} 150 A${r} ${r} 0 0 1 ${110 + r} 150`;
          const paths = cols.map((c, i) => `<path class="ghost" d="${arc(96 - i * 11)}"/>`).join('') + cols.map((c, i) => `<path class="band" d="${arc(96 - i * 11)}" stroke="${c}"/>`).join('');
          this.box = mk('rbow', `<svg viewBox="0 0 220 160" preserveAspectRatio="xMidYMax meet">${paths}</svg>`);
          this.uni = mk('flyer', '🦄');
          st.append(mk('ground'), mk('cloud c1', '☁️'), mk('cloud c2', '☁️'), this.box, this.uni);
          this.bands = [...this.box.querySelectorAll('.band')];
          this.bands.forEach(b => { const len = b.getTotalLength(); b.dataset.len = len; b.style.strokeDasharray = len; b.style.strokeDashoffset = len; });
        },
        render(level) { this.bands.forEach((b, i) => { const on = i < level; b.classList.toggle('on', on); b.style.strokeDashoffset = on ? 0 : b.dataset.len; }); },
        oops(ctx) { ctx.badgeAt(50, 12, '💫'); },
        async party(ctx) {
          const st = ctx.stage, W = st.clientWidth, H = st.clientHeight, r = this.box.querySelector('svg').getBoundingClientRect(), s = st.getBoundingClientRect();
          const scale = Math.min(r.width / 220, r.height / 160), ox = r.left - s.left + (r.width - 220 * scale) / 2, oy = r.top - s.top + (r.height - 160 * scale);
          const tx = ox + 110 * scale - 28, ty = oy + 150 * scale - 56 - 6;   // the unicorn rests under the arch, feet on the ground line
          const uni = this.uni, canAnim = !!uni.animate && !reduced();
          await wait(400);
          PV.sound.whoosh(); PV.sound.twinkle();
          if (canAnim) {
            const x0 = -70, y0 = H * .35;
            const frames = Array.from({ length: 41 }, (_, i) => { const k = i / 40, e = 1 - Math.pow(1 - k, 2.2);   // ease-out along a hump
              return { transform: `translate(${(x0 + (tx - x0) * e).toFixed(1)}px, ${(y0 + (ty - y0) * e - 70 * Math.sin(e * Math.PI)).toFixed(1)}px) rotate(${(-8 * Math.sin(e * Math.PI)).toFixed(1)}deg)`, opacity: k < .05 ? k / .05 : 1 }; });
            const a = uni.animate(frames, { duration: 2400, easing: 'linear', fill: 'forwards' });
            for (let i = 0; i < 9; i++) { await wait(260); PV.sparkle(uni, 4); }
            await a.finished.catch(() => {});
            a.cancel();
          } else { await wait(600); }
          uni.style.setProperty('--x', tx + 'px'); uni.style.setProperty('--y', ty + 'px');
          uni.style.transform = `translate(${tx}px, ${ty}px)`; uni.style.opacity = 1; uni.classList.add('hover');
          ctx.badgeAt((tx + 50) / W * 100, (ty - 10) / H * 100, '💖'); PV.sound.bells();
          await wait(1700);
          // off it goes, and the rainbow fades so it can be built again
          uni.classList.remove('hover');
          if (canAnim) {
            const b = uni.animate([{ transform: `translate(${tx}px, ${ty}px) rotate(0)`, opacity: 1 }, { transform: `translate(${W + 80}px, ${-90}px) rotate(-12deg)`, opacity: 1, offset: .85 }, { transform: `translate(${W + 120}px, -120px)`, opacity: 0 }], { duration: 1100, easing: 'cubic-bezier(.5, 0, .9, .6)', fill: 'forwards' });
            this.bands.slice().reverse().forEach((band, i) => setTimeout(() => { band.classList.remove('on'); band.style.strokeDashoffset = band.dataset.len; }, i * 110));
            await b.finished.catch(() => {}); b.cancel();
          } else { uni.style.opacity = 0; this.render(0); await wait(600); }
          uni.style.opacity = 0;
          await wait(300);
        },
      },

      /* --- 3. smoothie cup --- */
      smoothie: {
        steps: 6, title: 'ar_buddy_smoothie', FRUITS: ['🍓', '🍌', '🫐', '🥝', '🍊', '🍑'],
        build(st) {
          st.classList.add('kitchen');
          this.cup = mk('cup', '<div class="body"><div class="glass"><div class="juice"></div><div class="fruits"></div><div class="shine"></div><div class="smiley">😊</div></div><div class="lid"></div></div><div class="straw"></div>');
          st.append(this.cup);
          this.fruitsBox = this.cup.querySelector('.fruits'); this.fruits = [];
        },
        render(level) {
          while (this.fruits.length > level) { const f = this.fruits.pop(); f.classList.add('out'); setTimeout(() => f.remove(), 600); }   // the top fruit pops back out
          while (this.fruits.length < level) {
            const i = this.fruits.length, f = mk('fruit', this.FRUITS[i]);
            f.style.left = (i % 2 ? 54 : 12) + 'px'; f.style.bottom = (Math.floor(i / 2) * 38 + 6) + 'px';
            f.style.setProperty('--rot', rand(-20, 20) + 'deg'); f.style.setProperty('--sx', (i % 2 ? -20 : 20) + 'px');
            this.fruitsBox.append(f); this.fruits.push(f); PV.sound.pop();
          }
        },
        oops(ctx) { ctx.badgeAt(72, 18, '💫'); },
        async party(ctx) {
          const cup = this.cup;
          await wait(500);
          cup.classList.add('lidon'); PV.sound.pop();                                           // lid on
          await wait(700);
          cup.classList.add('shake', 'blend', 'full'); PV.sound.bubbles(); PV.sound.bubbles(.7); // shake: fruit swirls into juice
          await wait(1800);
          cup.classList.remove('shake', 'lidon'); this.fruits.forEach(f => f.remove()); this.fruits = [];
          cup.classList.add('straw-in', 'happy'); PV.sound.bells(); ctx.badgeAt(74, 14, '✨'); PV.sparkle(cup, 8);
          await wait(1700);
          cup.classList.remove('full', 'straw-in', 'happy', 'blend');                           // drink up, start again
          await wait(1000);
        },
      },

      /* --- 4. monkey: climbs the trunk to the banana --- */
      monkey: {
        steps: 6, title: 'ar_buddy_monkey',
        build(st) {
          const leaves = [-54, -28, 0, 28, 54].map(a => `<path d="M60 64 Q${60 + a * .7} 30 ${60 + a} 8" stroke="#2a9d5b" stroke-width="15" stroke-linecap="round" fill="none"/>`).join('');
          st.append(mk('trunk'), mk('canopy', `<svg viewBox="0 0 120 70" width="120" height="70">${leaves}</svg>`));
          this.banana = mk('item banana', '🍌'); this.mover = mk('mover mon', '<span class="face">🐒</span>');
          st.append(this.banana, this.mover);
        },
        render(level, st) {
          const span = st.clientHeight - 140;   // from the ground to just under the canopy
          this.mover.style.transform = `translate(-50%, ${-level * span / this.steps}px)`;
        },
        up() { kick(this.mover.querySelector('.face'), 'hop'); },
        oops(ctx) { kick(this.mover.querySelector('.face'), 'oops'); ctx.badgeNear(this.mover, '💫'); },
        async party(ctx) {
          await wait(600);
          kick(this.mover.querySelector('.face'), 'cheer'); this.banana.classList.add('eat'); ctx.badgeNear(this.mover, '😋'); PV.sound.bells(); PV.sparkle(this.banana, 8);
          await wait(2200);
          this.banana.classList.remove('eat'); kick(this.banana, 'pop');
          this.mover.style.transition = 'transform 1.6s var(--settle)'; this.render(0, ctx.stage);   // slides back down for the next banana
          await wait(1700);
          this.mover.style.transition = '';
        },
      },
    };

    const stage = el('stage');
    const badgeAt = (xPct, yPct, emoji) => { const b = mk('badge', emoji); b.style.left = xPct + '%'; b.style.top = yPct + '%'; stage.append(b); setTimeout(() => b.remove(), 1700); };
    const badgeNear = (node, emoji) => {
      const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const b = mk('badge', emoji); b.style.left = (r.left - s.left + r.width * .7) + 'px'; b.style.top = (r.top - s.top - 12) + 'px';
      stage.append(b); setTimeout(() => b.remove(), 1700);
    };
    const ctx = { stage, badgeAt, badgeNear };
    const buddy = {
      def: null, kind: '', level: 0, partying: false,
      pick(kind) {
        this.kind = Buddies[kind] ? kind : shuffle(Object.keys(Buddies))[0];
        this.def = Buddies[this.kind]; this.level = 0; this.partying = false;
        stage.className = 'stage'; stage.replaceChildren(); this.def.build(stage);
        el('buddyTitle').innerHTML = t(this.def.title);
        this.render();
      },
      render() { if (this.def && !this.partying) this.def.render(this.level, stage); },
      up() {
        this.level = Math.min(this.level + 1, this.def.steps);
        if (this.def.up) this.def.up(ctx);
        this.render();
        if (this.level >= this.def.steps && !this.partying) this.party();
      },
      down() {
        this.level = Math.max(0, this.level - 1);
        if (this.partying) return;              // the finale plays on; the level is already corrected
        if (this.def.oops) this.def.oops(ctx);
        this.render();
      },
      /* the finale. Answers keep coming meanwhile: `level` restarts at 0 and keeps counting, the visuals re-sync at the end */
      async party() {
        this.partying = true; this.level = 0;
        const def = this.def;
        try { await def.party(ctx); } catch { /* keep playing */ }
        if (this.def !== def) return;           // a new game picked another buddy meanwhile
        this.partying = false; this.level = Math.min(this.level, def.steps - 1); this.render();
      },
    };
    stage.addEventListener('animationend', e => {
      const cls = { bHop: 'hop', bOops: 'oops', bCheer: 'cheer', itemPop: 'pop', rgPop: 'on-pop' }[e.animationName];
      if (cls && cls !== 'on-pop') e.target.classList.remove(cls);
    });
    addEventListener('resize', () => buddy.render());

    /* ================= the game ================= */
    let dur = DURS.includes(store.get('pv-ar-dur', 60)) ? store.get('pv-ar-dur', 60) : 60;
    /* Input dedup: `locked` is true from the moment an answer is given until the next round is drawn (keys, taps,
       swipes and double-taps in between are ignored); `starting` keeps Start / Play again from running two timers;
       `pending` is the one scheduled next-round timer, cleared on start/finish so a stale one can't skip a round. */
    let running = false, starting = false, locked = true, score = 0, misses = 0, round = null, t0 = 0, raf = 0, lastWhole = 0, pending = 0;
    const opts = {}; document.querySelectorAll('.opt').forEach(b => opts[b.dataset.dir] = b);
    const bestKey = () => 'pv-ar-best-' + dur;
    const bestLine = () => { const b = store.get(bestKey(), 0); return b ? t('ar_best', { s: dur, n: b }) : t('ar_nobest', { s: dur }); };

    function renderSetup() {
      const box = el('durs'); box.replaceChildren();
      DURS.forEach(d => {
        const c = mk('chip' + (d === dur ? ' active' : ''), t('ar_sec', { n: d }), 'button');
        c.onclick = () => { dur = d; store.set('pv-ar-dur', d); renderSetup(); PV.sound.pop(); };
        box.append(c);
      });
      el('bestline').innerHTML = bestLine();
    }
    function show(id) { ['setup', 'game', 'end'].forEach(k => el(k).hidden = k !== id); }

    async function start() {
      if (starting || running) return;
      starting = true; cancelAnimationFrame(raf); clearTimeout(pending);
      show('game'); locked = true; score = 0; misses = 0; lastDirs = []; round = null;
      buddy.pick(forcedBuddy());
      el('score').innerHTML = t('ar_score', { n: 0 });
      el('secs').textContent = dur; el('arc').style.strokeDashoffset = 0; el('ring').classList.remove('hurry');
      el('caption').className = 'caption'; el('caption').innerHTML = t('ar_ready');
      el('mid').textContent = ''; DIRS.forEach(d => { opts[d].className = 'opt'; opts[d].querySelector('.n').textContent = ''; });
      PV.sound.pop();
      await wait(800);
      t0 = performance.now(); lastWhole = dur; running = true; starting = false;
      nextRound(true); frame();
    }
    function frame() {
      if (!running) return;
      const left = Math.max(0, dur - (performance.now() - t0) / 1000);
      el('arc').style.strokeDashoffset = RING * (1 - left / dur);
      const whole = Math.ceil(left);
      if (whole !== lastWhole) { lastWhole = whole; el('secs').textContent = whole; if (whole > 0 && whole <= 3) PV.sound.pop(); }
      el('ring').classList.toggle('hurry', left <= 5);
      if (left <= 0) finish(); else raf = requestAnimationFrame(frame);
    }
    function nextRound(first = false) {
      if (!running) return;
      round = makeRound();
      const mid = el('mid'); mid.textContent = round.n; kick(mid, 'pop');
      DIRS.forEach(d => { opts[d].className = 'opt'; opts[d].querySelector('.n').textContent = round.opts[d]; });
      kick(el('cross'), 'round-in');
      if (first) el('caption').innerHTML = t('ar_q', { n: round.n });
      PV.say(PV.word(round.n));
      locked = false;
    }
    function answer(dir) {
      if (!running || locked || !round) return;
      locked = true;
      const btn = opts[dir], cap = el('caption'), arrow = eq(`${round.n} → <b>${round.next}</b>`);
      if (dir === round.dir) {
        score++; PV.sound.good(); btn.classList.add('ok'); PV.sparkle(btn, 5); buddy.up();
        cap.innerHTML = t(round.cross ? 'ar_good_cross' : 'ar_good', { eq: arrow }); cap.className = 'caption good';
        el('score').innerHTML = t('ar_score', { n: score });
        pending = setTimeout(nextRound, 340);
      } else {
        misses++; PV.sound.bad(); btn.classList.add('bad'); opts[round.dir].classList.add('ok');
        DIRS.forEach(d => d !== dir && d !== round.dir && opts[d].classList.add('dim'));
        buddy.down();
        cap.innerHTML = t(round.cross ? 'ar_wrong_cross' : 'ar_wrong', { w: round.opts[dir], n: round.n, c: round.next, eq: arrow }); cap.className = 'caption warn';
        pending = setTimeout(nextRound, 1400);
      }
    }
    function finish() {
      running = false; locked = true; cancelAnimationFrame(raf); clearTimeout(pending);
      el('arc').style.strokeDashoffset = RING; el('secs').textContent = 0;
      const best = store.get(bestKey(), 0), isBest = score > best;
      if (isBest) store.set(bestKey(), score);
      show('end');
      el('final').textContent = score;
      el('result').innerHTML = t('ar_result', { n: score, s: dur });
      el('misses').innerHTML = t('ar_misses', { n: misses });
      el('endbest').innerHTML = isBest ? `<div class="newbest">${t('ar_newbest')}</div>` : bestLine();
      PV.celebrate('big');
      if (isBest) setTimeout(() => PV.sparkle(el('final'), 12), 300);
    }

    /* ---- input: arrow keys, tapping the numbers, swiping anywhere on the cross ---- */
    document.addEventListener('keydown', e => {
      const d = KEYS[e.key]; if (!d || el('game').hidden) return;
      e.preventDefault();                         // the page must not scroll
      if (!e.repeat) answer(d);
    });
    let swipe = null, swipedAt = 0;
    const cross = el('cross');
    cross.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY }; });
    cross.addEventListener('pointerup', e => {
      if (!swipe) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;   // a tap: the button's click handles it
      swipedAt = performance.now();
      answer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
    cross.addEventListener('pointercancel', () => { swipe = null; });
    DIRS.forEach(d => opts[d].addEventListener('click', () => { opts[d].blur(); if (performance.now() - swipedAt > 400) answer(d); }));

    el('start').onclick = start;
    el('again').onclick = start;
    el('change').onclick = () => { if (!running && !starting) { show('setup'); renderSetup(); } };

    /* ?buddy=painting|rainbow|smoothie|monkey forces a buddy (testing) */
    const forcedBuddy = () => { try { return new URLSearchParams(location.search).get('buddy'); } catch { return null; } };
    renderSetup();
    buddy.pick(forcedBuddy());
    window.AR = { buddy, Buddies, start, answer, finish, makeRound, distractors, get round() { return round; }, get running() { return running; } };   // for testing
  </script>
</body>
</html>
