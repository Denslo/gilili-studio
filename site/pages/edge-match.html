<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="em_title">Ten Twins</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 560px; margin: 0 auto; }
    .mcard { aspect-ratio: 3 / 4; perspective: 600px; border: none; background: none; padding: 0; cursor: pointer; animation: dealIn .55s var(--settle) both; animation-delay: calc(var(--i) * 45ms); }
    @keyframes dealIn { from { transform: translateY(40px) scale(.4) rotate(-8deg); opacity: 0; } 70% { transform: translateY(-4px) scale(1.03); opacity: 1; } to { transform: none; opacity: 1; } }
    .mcard .inner { position: relative; width: 100%; height: 100%; transition: transform .6s var(--spring); transform-style: preserve-3d; }
    .mcard:not(.up):not(.matched):active .inner { transform: scale(.94) rotate(-2deg); transition-duration: .1s; }
    .mcard.up .inner, .mcard.matched .inner { transform: rotateY(180deg); }
    .mcard.matched .inner { animation: matchPop .7s var(--settle) .35s; }
    @keyframes matchPop { 0%, 100% { transform: rotateY(180deg); } 35% { transform: rotateY(180deg) scale(1.14) rotate(-4deg); } 65% { transform: rotateY(180deg) scale(.96) rotate(2deg); } }
    .mcard.nope .inner { animation: headshake .5s ease .5s; }
    @keyframes headshake { 0%, 100% { transform: rotateY(180deg); } 20%, 60% { transform: rotateY(180deg) translateX(-7px) rotate(-3deg); } 40%, 80% { transform: rotateY(180deg) translateX(7px) rotate(3deg); } }
    .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
    .back-face { background: repeating-linear-gradient(45deg, var(--tens) 0 12px, #4a84e6 12px 24px); color: #fff; font-size: 34px; }
    .front-face { background: #fff; transform: rotateY(180deg); font-size: clamp(30px, 9vw, 52px); font-weight: 900; flex-direction: column; direction: ltr; transition: background .3s, box-shadow .3s; }
    .mcard.matched .front-face { background: var(--good-soft); box-shadow: inset 0 0 0 4px var(--good); }
    @media (prefers-reduced-motion: reduce) { .mcard, .mcard.matched .inner, .mcard.nope .inner { animation: none; } .mcard .inner { transition-timing-function: ease; } }
    .front-face small { font-size: 13px; color: var(--good); font-weight: 900; }
    .stats { display: flex; justify-content: center; gap: 24px; font-weight: 900; font-size: 20px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" data-i18n="back"></a>
    <h1 data-i18n="em_title"></h1>
    <div class="toggles" data-toggles></div>
  </header>

  <main class="page stack">
    <p class="intro" data-i18n="em_intro"></p>
    <div class="card stack">
      <div class="stats">
        <span><span data-i18n="em_pairs"></span> <span class="eq"><span id="pairs">0</span> / 6</span></span>
        <span><span data-i18n="em_flips"></span> <span id="flips">0</span></span>
      </div>
      <div class="board" id="board"></div>
      <div class="caption" id="caption"></div>
      <div class="controls"><button class="btn blue small" id="restart" data-i18n="em_new"></button></div>
    </div>
  </main>

  <script src="../assets/strings.js"></script>
  <script src="../assets/common.js"></script>
  <script>
    const el = id => document.getElementById(id);
    const { t, eq } = PV;
    const caption = el('caption');
    let open = [], pairs = 0, flips = 0, lock = false;
    // lock: cards are dealing in or a wrong pair is turning back; gen: bumped on every new game so timers from the old game do nothing
    let gen = 0;
    const DEAL_MS = 12 * 45 + 550;

    const colored = n => {
      if (n === 100) return '<span class="h">100</span>';
      const s = String(n);
      return s.length === 1 ? `<span class="o">${s}</span>` : `<span class="t">${s[0]}</span><span class="o">${s[1]}</span>`;
    };

    function newGame() {
      open = []; pairs = 0; flips = 0; lock = true;
      const g = ++gen;
      setTimeout(() => { if (g === gen) lock = false; }, DEAL_MS);
      el('pairs').textContent = 0; el('flips').textContent = 0;
      caption.innerHTML = t('em_tap'); caption.className = 'caption';
      const decades = PV.shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, 6);   // up to 89 ↔ 90, so every card stays under 100
      const cards = PV.shuffle(decades.flatMap(d => [{ n: d * 10 + 9, pair: d }, { n: d * 10 + 10, pair: d }]));
      el('board').replaceChildren(...cards.map((c, i) => {
        const b = document.createElement('button'); b.className = 'mcard'; b.style.setProperty('--i', i);
        b.innerHTML = `<div class="inner"><div class="face back-face">?</div><div class="face front-face"><div>${colored(c.n)}</div><small></small></div></div>`;
        b.setAttribute('aria-label', '?');
        b.onclick = () => flip(b, c);
        return b;
      }));
    }

    function flip(b, c) {
      if (lock || b.classList.contains('up') || b.classList.contains('matched')) return;
      const g = gen;
      b.classList.add('up'); b.setAttribute('aria-label', String(c.n));
      PV.sound.pop(); PV.say(PV.word(c.n));
      open.push({ b, c });
      if (open.length < 2) return;
      el('flips').textContent = ++flips;
      const [x, y] = open; open = [];
      if (x.c.pair === y.c.pair) {
        const lo = Math.min(x.c.n, y.c.n), hi = lo + 1;
        [x, y].forEach(o => { o.b.classList.add('matched'); o.b.querySelector('small').textContent = `${lo} + 1 = ${hi}`; });
        el('pairs').textContent = ++pairs;
        caption.innerHTML = t('em_match', { eq: eq(`<b>${lo}</b> + 1 = <b>${hi}</b>`) });
        caption.className = 'caption good'; PV.sound.good();
        setTimeout(() => { if (g !== gen) return; [x, y].forEach(o => PV.sparkle(o.b, 7)); if (pairs < 6) PV.celebrate('small', { sound: false }); }, 450);
        if (pairs === 6) setTimeout(() => {
          if (g !== gen) return;
          caption.innerHTML = t('em_all', { f: flips }); PV.celebrate('big');
        }, 700);
      } else {
        lock = true;
        const [a, b2] = [x.c.n, y.c.n].sort((p, q) => p - q);
        caption.innerHTML = t('em_not', { a, b: b2 });
        caption.className = 'caption';
        [x, y].forEach(o => o.b.classList.add('nope'));
        setTimeout(() => {
          if (g !== gen) return;
          [x, y].forEach(o => { o.b.classList.remove('up', 'nope'); o.b.setAttribute('aria-label', '?'); });
          lock = false;
        }, 1300);
      }
    }

    el('restart').onclick = newGame;
    newGame();
  </script>
</body>
</html>
